name: Validate

on:
  pull_request:
    # ready_for_review is listed so a draft gets its checks the moment it is
    # marked ready; the default types alone would wait for the next push.
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    # Draft PRs skip every job that carries this condition. A skipped job
    # still counts as passing, and marking the PR ready runs it.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Validate JSON
        run: |
          python -m json.tool .agents/plugins/marketplace.json >/dev/null
          python -m json.tool plugins/claude-mem-codex/.codex-plugin/plugin.json >/dev/null
          python -m json.tool plugins/claude-mem-codex/.mcp.json >/dev/null
          python -m json.tool plugins/claude-mem-codex/hooks/hooks.json >/dev/null
      - name: Check shell scripts
        run: sh -n plugins/claude-mem-codex/scripts/*.sh
      - name: Run tests
        run: python -m unittest discover -s tests -v

